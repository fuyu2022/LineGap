<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$GODOT_PROJECT_NAME</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    body { display: flex; flex-direction: column; color: #92999f; font: 12px system-ui, sans-serif; }
    main { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
    #canvas { display: block; outline: none; touch-action: none; }
    footer { flex: none; min-height: 28px; display: flex; justify-content: center; align-items: center;
      gap: 8px 20px; flex-wrap: wrap; padding: 4px 12px; box-sizing: border-box; font-size: 11px; }
    a { color: #92999f; text-decoration: none; }
    a:hover { color: #65f6dc; }
    #status { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px; }
    #status progress { width: min(280px, 70vw); height: 4px; accent-color: #65f6dc; }
    #notice { text-align: center; white-space: pre-wrap; max-width: 85vw; }
  </style>
  $GODOT_HEAD_INCLUDE
</head>
<body>
  <main><canvas id="canvas" tabindex="0" aria-label="LINE GAP game">Canvas is not supported.</canvas></main>
  <footer>
    <span id="audio-hint">点击游戏或按空格启用声音 / Click or press Space for audio</span>
    <a href="https://github.com/fuyu2022/LineGap" target="_blank" rel="noopener">GitHub</a>
    <a href="https://incompetech.com/music/royalty-free/index.html?isrc=USUAN1500031" target="_blank" rel="noopener">Bumba Crossing — Kevin MacLeod</a>
    <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>
    <a href="Music-Credits.txt" target="_blank" rel="noopener">音乐署名 / Music credits</a>
    <a href="Godot-Licenses.txt" target="_blank" rel="noopener">Godot license</a>
    <a href="Font-License.txt" target="_blank" rel="noopener">Font license</a>
  </footer>
  <noscript>请启用 JavaScript 后打开游戏 / Enable JavaScript to play.</noscript>
  <div id="status" role="status"><span id="notice">线隙 · LINE GAP</span><progress id="progress"></progress></div>
  <script src="input.js"></script>
  <script src="audio.js"></script>
  <script src="$GODOT_URL"></script>
  <script>
    const engine = new Engine($GODOT_CONFIG);
    const canvas = document.getElementById('canvas');
    // Audio is handled by audio.js, so Godot's unused Web mixer stays disabled.
    engine.config.update({ canvasResizePolicy: 0, args: ['--audio-driver', 'Dummy'] });
    function resizeCanvas() {
      const available = document.querySelector('main').getBoundingClientRect();
      const width = Math.max(1, Math.min(available.width, available.height * 1.5));
      const height = width / 1.5;
      const ratio = window.devicePixelRatio || 1;
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      canvas.width = Math.round(width * ratio);
      canvas.height = Math.round(height * ratio);
    }
    new ResizeObserver(resizeCanvas).observe(document.querySelector('main'));
    resizeCanvas();
    const chinese = (navigator.language || '').toLowerCase().startsWith('zh');
    document.documentElement.lang = chinese ? 'zh-CN' : 'en';
    document.title = chinese ? '线隙 · LINE GAP' : 'LINE GAP';
    const notice = document.getElementById('notice');
    notice.textContent = document.title;
    function fail(reason) {
      console.error(reason);
      document.getElementById('progress').hidden = true;
      notice.textContent = (chinese ? '游戏加载失败\n' : 'Game failed to load\n') + String(reason.message || reason);
    }
    const missing = Engine.getMissingFeatures({ threads: false });
    if (missing.length) fail(new Error(missing.join(', ')));
    else engine.startGame({ onProgress: (current, total) => {
      const progress = document.getElementById('progress');
      if (total > 0) { progress.max = total; progress.value = current; }
    }}).then(() => {
      document.getElementById('status').remove();
      canvas.dataset.loaded = 'true';
      canvas.focus();
    }).catch(fail);
  </script>
</body>
</html>
